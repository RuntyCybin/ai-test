spring:
  application:
    name: aidemo
  ai:
    anthropic:
      # Exporta la variable de entorno ANTHROPIC_API_KEY antes de arrancar
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: claude-opus-5-5
        max-tokens: 16000
        # Nota: claude-opus-5-5 no admite temperature/top-p/top-k ni desactivar el
        # razonamiento; para controlarlo se usa "effort" (ver BasicChatController#deep).
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    # Muestra peticiones y respuestas del SimpleLoggerAdvisor
    org.springframework.ai.chat.client.advisor: DEBUG
